[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-factor-equity"
version = "0.1.0"
description = "Research slice: cross-sectional 12-1 momentum and low-vol with costs and walk-forward OOS."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M.Varun" }]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "yfinance",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
